<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Cork agent entry</title><style>body{font:16px system-ui;max-width:480px;margin:24px auto;padding:0 16px}label{display:block;margin:10px 0 4px;font-weight:600}input,select,textarea{width:100%;padding:8px;box-sizing:border-box}button{margin-top:14px;padding:10px 16px}</style></head><body><h1>Add a wine</h1><p>Add-only entry for an authorized agent. Needs an entry key; it cannot read anything.</p><form id="f"><label>Entry key<input name="key" type="password" autocomplete="off" required></label><label>Producer<input name="producer" required maxlength="120"></label><label>Wine<input name="name" required maxlength="160"></label><label>Vintage<input name="vintage" type="number"></label><label>Country<input name="country" maxlength="80"></label><label>Style<select name="style"><option>Red</option><option>White</option><option>Rosé</option><option>Sparkling</option><option>Other</option></select></label><label>Rating<input name="score" type="number" step="0.1" min="0" max="10" required></label><label>Note<textarea name="notes" maxlength="2000"></textarea></label><button>Add</button></form><p id="out" role="status"></p><script>
document.getElementById('f').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));const r=await fetch('https://joxpfgbezqxinuturvhj.supabase.co/rest/v1/rpc/agent_add_wine',{method:'POST',headers:{'content-type':'application/json',apikey:'sb_publishable_FztBpbAPfQc44mC7VSP9kg_VsyyijRJ'},body:JSON.stringify({p_key:d.key,p_producer:d.producer,p_name:d.name,p_vintage:d.vintage?Number(d.vintage):null,p_country:d.country||'',p_style:d.style,p_score:Number(d.score),p_notes:d.notes||''})});document.getElementById('out').textContent=r.ok?'Added.':'Not added ('+r.status+').';};
</script></body></html>
